name: Linguagens do perfil

# Refaz o cartão top-langs.svg do README todo dia (e quando pedido).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cartao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tool/top_langs.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          git diff --quiet -- top-langs.svg && exit 0
          git config user.name OctavioKonzen
          git config user.email 131984455+OctavioKonzen@users.noreply.github.com
          git add top-langs.svg
          git commit -m "Cartão de linguagens atualizado"
          git push
